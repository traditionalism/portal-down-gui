name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    name: Windows (amd64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        run: wails build -platform windows/amd64 -clean -s

      - name: Package
        shell: pwsh
        run: |
          Compress-Archive -Path build/bin/portal-down-gui.exe `
            -DestinationPath portal-down-gui-windows-amd64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: portal-down-gui-windows-amd64.zip

  build-linux:
    name: Linux (amd64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libgtk-3-dev \
            libwebkit2gtk-4.0-dev \
            gcc \
            pkg-config

      - name: Install Wails
        run: go install github.com/wailsapp/wails/v2/cmd/wails@latest

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      - name: Build
        run: wails build -platform linux/amd64 -clean -s

      - name: Package
        run: |
          tar -czf portal-down-gui-linux-amd64.tar.gz \
            -C build/bin portal-down-gui

      - uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: portal-down-gui-linux-amd64.tar.gz

  release:
    name: Create Release
    needs: [build-windows, build-linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body: |
            ## Downloads

            | Platform | File |
            |---|---|
            | Windows (64-bit) | `portal-down-gui-windows-amd64.zip` |
            | Linux (64-bit) | `portal-down-gui-linux-amd64.tar.gz` |
          files: |
            portal-down-gui-windows-amd64.zip
            portal-down-gui-linux-amd64.tar.gz
